name: 部署到 GitHub Pages

on:
  push:
    branches: ["main"]   # 如果你的預設分支不是 main（例如是 master），請把這裡改成你的分支名稱
  workflow_dispatch:      # 允許在 GitHub 網頁上手動點擊執行一次

# 讓這個 workflow 有權限發布到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 準備要發布的資料夾（把整個 repo 內容複製一份，排除 .git 和 workflow 設定本身）
        run: |
          mkdir -p _site
          rsync -av --exclude='.git' --exclude='.github' --exclude='_site' --exclude='apps-script' --exclude='tests' ./ _site/

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳成 Pages 要用的產物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 正式發布
        id: deployment
        uses: actions/deploy-pages@v4
